<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // ---- adaptive performance tiers -----------------------------------------
  // Runs as early as possible so the right class lands on <html> before
  // first paint whenever hardware alone can tell us enough (the "too weak,
  // turn everything off from the start" case). Otherwise it measures real
  // frames for a moment and steps down through tiers until it reaches a
  // comfortable frame rate:
  //   full  -> PC buena:   ya anda 50+ fps, se dejan todos los efectos.
  //   mid   -> PC media:   ronda los 30 fps, se apagan los efectos mas
  //                        costosos (blur, parallax, brillos animados)
  //                        hasta volver a 50+.
  //   low   -> PC mala:    ronda los 15 fps, se apagan casi todos los
  //                        efectos hasta llegar a 40-50.
  //   ultra -> PC muy mala: se apaga todo desde el arranque, sin esperar
  //                        a medir nada.
  (function(){
    var root = document.documentElement;
    var MANUAL_KEY = 'leianet-perf';       // 'low' | 'full' — eleccion manual del toggle del header
    var AUTO_KEY   = 'leianet-perf-auto';  // cache de la deteccion automatica: {tier, ts}
    var AUTO_TTL   = 6 * 60 * 60 * 1000;   // 6h — despues de eso se vuelve a medir
    var TIERS = ['full', 'mid', 'low', 'ultra'];

    window.__PERF_KEY = MANUAL_KEY;
    window.__PERF_TIER = 'full';
    window.__LOW_PERF__ = false;      // true en 'low' y 'ultra' (compat con scripts existentes)
    window.__MID_OR_WORSE__ = false;  // true en 'mid', 'low' y 'ultra'

    function applyClasses(tier){
      root.classList.remove('perf-mid', 'low-perf', 'force-full-fx');
      if(tier === 'mid'){ root.classList.add('perf-mid'); }
      else if(tier === 'low' || tier === 'ultra'){ root.classList.add('low-perf'); }
      else { root.classList.add('force-full-fx'); }
    }

    function applyTier(tier, reason){
      var wasMidOrWorse = window.__MID_OR_WORSE__;
      window.__PERF_TIER = tier;
      window.__LOW_PERF__ = (tier === 'low' || tier === 'ultra');
      window.__MID_OR_WORSE__ = (tier !== 'full');
      applyClasses(tier);
      try{ window.dispatchEvent(new CustomEvent('perftier:change', {detail:{tier: tier, reason: reason}})); }catch(e){}
      if(!wasMidOrWorse && window.__MID_OR_WORSE__){
        try{ window.dispatchEvent(new CustomEvent('perfmid:on', {detail:{tier: tier, reason: reason}})); }catch(e){}
      }
      if(window.__LOW_PERF__){
        try{ window.dispatchEvent(new CustomEvent('lowperf:on', {detail:{reason: reason}})); }catch(e){}
      }
    }

    // API publica — usada por el toggle manual de rendimiento del header.
    window.__enableLowPerf = function(reason){ applyTier('low', reason || 'manual'); };
    window.__disableLowPerf = function(){ applyTier('full', 'manual'); };
    // API publica generica — permite a otros scripts (ej. el minijuego)
    // forzar un tier exacto ('full'|'mid'|'low'|'ultra') sin tocar la
    // eleccion manual guardada en localStorage, para poder restaurarla
    // despues tal cual estaba.
    window.__setPerfTier = function(tier, reason){
      if(TIERS.indexOf(tier) === -1) return;
      applyTier(tier, reason || 'external');
    };

    // 0) eleccion manual explicita del usuario: gana siempre, sin medir nada.
    var manual = null;
    try{ manual = localStorage.getItem(MANUAL_KEY); }catch(e){}
    if(manual === 'low'){ applyTier('low', 'manual'); return; }
    if(manual === 'full'){ applyTier('full', 'manual'); return; }

    // 1) resultado automatico cacheado de una visita anterior — evita medir
    // (y el pequeno lag inicial que eso implica) en cada carga de pagina.
    try{
      var cachedRaw = localStorage.getItem(AUTO_KEY);
      if(cachedRaw){
        var cached = JSON.parse(cachedRaw);
        if(cached && TIERS.indexOf(cached.tier) !== -1 && (Date.now() - cached.ts) < AUTO_TTL){
          applyTier(cached.tier, 'cached');
          return;
        }
      }
    }catch(e){}

    // 2) chequeo de hardware — solo para el caso "demasiado mala", que se
    // debe apagar todo desde el arranque sin esperar a medir fps. Se
    // salta por completo en Brave: sus "Shields" alteran a proposito
    // navigator.deviceMemory y navigator.hardwareConcurrency (los bajan o
    // randomizan) como proteccion anti-fingerprinting, asi que en Brave
    // esos valores no reflejan el hardware real y confiar en ellos daria
    // falsos positivos en maquinas potentes. En Brave se pasa directo a
    // la medicion de fps de abajo, que es la unica senal confiable ahi.
    var isBrave = false;
    try{ isBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function'); }catch(e){}
    if(!isBrave){
      try{
        var mem = navigator.deviceMemory;          // GB, undefined si el navegador no lo expone
        var cores = navigator.hardwareConcurrency;  // nucleos logicos, undefined en algunos navegadores
        var tooWeak = (typeof mem === 'number' && mem <= 2) || (typeof cores === 'number' && cores <= 2);
        if(tooWeak){
          applyTier('ultra', 'hardware');
          try{ localStorage.setItem(AUTO_KEY, JSON.stringify({tier: 'ultra', ts: Date.now()})); }catch(e){}
          return;
        }
      }catch(e){}
    }

    // 3) medicion de fps en rondas cortas (~900ms cada una). Arranca
    // asumiendo 'full' (que es lo que ya esta puesto en <html> por
    // defecto) y va bajando de nivel hasta encontrar una velocidad comoda,
    // o hasta tocar fondo en 'ultra'. Rondas cortas para que una maquina
    // mala no quede varios segundos en un nivel que le cuesta sostener.
    var ROUND_MS = 900;

    function measure(cb){
      var frames = 0, start = null;
      function tick(ts){
        if(start === null) start = ts;
        frames++;
        if(ts - start < ROUND_MS){
          requestAnimationFrame(tick);
        } else {
          cb(frames / ((ts - start) / 1000));
        }
      }
      requestAnimationFrame(tick);
    }

    function finish(tier){
      applyTier(tier, 'fps');
      try{ localStorage.setItem(AUTO_KEY, JSON.stringify({tier: tier, ts: Date.now()})); }catch(e){}
    }

    measure(function(fpsFull){
      if(fpsFull >= 50){ finish('full'); return; }
      if(fpsFull >= 30){
        applyTier('mid', 'fps');
        measure(function(fpsMid){
          if(fpsMid >= 50){ finish('mid'); return; }
          if(fpsMid >= 15){
            applyTier('low', 'fps');
            measure(function(fpsLow){ finish(fpsLow >= 40 ? 'low' : 'ultra'); });
            return;
          }
          finish('ultra');
        });
        return;
      }
      if(fpsFull >= 15){
        applyTier('low', 'fps');
        measure(function(fpsLow){ finish(fpsLow >= 40 ? 'low' : 'ultra'); });
        return;
      }
      finish('ultra');
    });
  })();
</script>

<script>
  // starfield generator — random dots per layer via box-shadow (cheap, no DOM bloat)
  (function(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const layers = [
      {id:'stars-s1', count:130, size:1, opacity:.9},
      {id:'stars-s2', count:80, size:2, opacity:.7},
      {id:'stars-s3', count:40, size:1, opacity:1}
    ];
    const w = 2600, h = 2000; // generous virtual canvas so it covers tall pages too
    layers.forEach(layer=>{
      const el = document.getElementById(layer.id);
      if(!el) return;
      let shadows = [];
      for(let i=0;i<layer.count;i++){
        const x = Math.round(Math.random()*w);
        const y = Math.round(Math.random()*h);
        shadows.push(`${x}px ${y}px ${reduceMotion ? 0 : 0}px rgba(255,255,255,${layer.opacity})`);
      }
      el.style.width = layer.size+'px';
      el.style.height = layer.size+'px';
      el.style.borderRadius = '50%';
      el.style.background = 'transparent';
      el.style.boxShadow = shadows.join(',');
    });
    // sparkle stars — a handful of stars that flare brightly at random moments, like a glint/reflection
    if(!reduceMotion && !window.__MID_OR_WORSE__){
      const container = document.getElementById('sparkles');
      if(container){
        const count = 14;
        for(let i=0;i<count;i++){
          const s = document.createElement('div');
          s.className = 'sparkle';
          const size = Math.random() < .3 ? 3 : 2;
          s.style.width = size+'px';
          s.style.height = size+'px';
          s.style.left = Math.random()*100+'vw';
          s.style.top = Math.random()*window.innerHeight+'px';
          s.style.animationDuration = (3.5 + Math.random()*4.5)+'s';
          s.style.animationDelay = (Math.random()*6)+'s';
          container.appendChild(s);
        }
      }
    }
    // shooting stars — spawn at irregular random intervals, travelling along
    // a real curved arc (like a comet) through the middle of the screen
    if(!reduceMotion && !window.__MID_OR_WORSE__){
      const starfield = document.querySelector('.starfield');
      const supportsOffsetPath = window.CSS && CSS.supports && CSS.supports('offset-path', "path('M0,0')");
      function spawnShootingStar(){
        if(!starfield) return;
        // safety net: never let more than a few pile up at once, no
        // matter what caused it (throttled/frozen background tabs, etc.)
        if(starfield.querySelectorAll('.shooting-star').length >= 3) return;
        const el = document.createElement('div');
        el.className = 'shooting-star fire';
        const vw = window.innerWidth, vh = window.innerHeight;
        // start somewhere in the middle band of the screen
        const startTop = 15 + Math.random()*45;   // % of viewport height
        const startLeft = 10 + Math.random()*40;  // % of viewport width
        el.style.top = startTop + '%';
        el.style.left = startLeft + '%';
        // direction: left-to-right or right-to-left
        const dir = Math.random() < 0.5 ? 1 : -1;
        const dx = dir * (Math.min(vw*0.35, 420) + Math.random()*120);
        const dy = 70 + Math.random()*160; // always drifts downward a bit
        const dur = (1.0 + Math.random()*0.6);
        el.style.setProperty('--star-dur', dur.toFixed(2)+'s');
        if(supportsOffsetPath){
          // curve it via a perpendicular-offset control point, like a gentle
          // arc ( or ) rather than a straight diagonal line
          const len = Math.hypot(dx,dy) || 1;
          const perpX = -dy/len, perpY = dx/len;
          const curveSign = Math.random() < 0.5 ? 1 : -1;
          const curveAmt = 50 + Math.random()*70;
          const cx = dx/2 + perpX*curveAmt*curveSign;
          const cy = dy/2 + perpY*curveAmt*curveSign;
          el.style.offsetPath = `path('M0,0 Q${cx.toFixed(1)},${cy.toFixed(1)} ${dx.toFixed(1)},${dy.toFixed(1)}')`;
        } else {
          el.style.setProperty('--star-dx', dx.toFixed(1)+'px');
          el.style.setProperty('--star-dy', dy.toFixed(1)+'px');
        }
        starfield.appendChild(el);
        el.addEventListener('animationend', ()=> el.remove());
      }
      function spawnMeteor(){
        if(!starfield) return;
        if(starfield.querySelectorAll('.meteor').length >= 1) return; // rare — only one at a time
        const el = document.createElement('div');
        el.className = 'meteor';
        el.innerHTML = '<div class="meteor-trail"></div><div class="meteor-rock"></div>';
        const vw = window.innerWidth;
        // start near the top, biased toward the edges so it streaks across
        const startTop = 2 + Math.random()*18;    // % of viewport height
        const startLeft = 5 + Math.random()*60;   // % of viewport width
        el.style.top = startTop + '%';
        el.style.left = startLeft + '%';
        const dir = Math.random() < 0.5 ? 1 : -1;
        const dx = dir * (Math.min(vw*0.45, 560) + Math.random()*160);
        const dy = 220 + Math.random()*220; // falls steeply, unlike the gentler shooting stars
        const dur = (2.0 + Math.random()*1.0);
        el.style.setProperty('--meteor-dur', dur.toFixed(2)+'s');
        if(supportsOffsetPath){
          const len = Math.hypot(dx,dy) || 1;
          const perpX = -dy/len, perpY = dx/len;
          const curveSign = Math.random() < 0.5 ? 1 : -1;
          const curveAmt = 30 + Math.random()*40;
          const cx = dx/2 + perpX*curveAmt*curveSign;
          const cy = dy/2 + perpY*curveAmt*curveSign;
          el.style.offsetPath = `path('M0,0 Q${cx.toFixed(1)},${cy.toFixed(1)} ${dx.toFixed(1)},${dy.toFixed(1)}')`;
        } else {
          el.style.setProperty('--meteor-dx', dx.toFixed(1)+'px');
          el.style.setProperty('--meteor-dy', dy.toFixed(1)+'px');
        }
        starfield.appendChild(el);
        el.addEventListener('animationend', ()=> el.remove());
      }
      let starTimers = [];
      function clearStarTimers(){
        starTimers.forEach(id => clearTimeout(id));
        starTimers = [];
      }
      function scheduleNext(){
        const delay = 2200 + Math.random()*5500; // irregular: 2.2s–7.7s apart
        const id = setTimeout(()=>{
          if(document.hidden){ scheduleNext(); return; } // don't spawn while tab is hidden
          spawnShootingStar();
          if(Math.random() < .3){
            const id2 = setTimeout(spawnShootingStar, 400 + Math.random()*500);
            starTimers.push(id2);
          }
          scheduleNext();
        }, delay);
        starTimers.push(id);
      }
      function scheduleNextMeteor(){
        const delay = 20000 + Math.random()*25000; // rare: every 20s–45s
        const id = setTimeout(()=>{
          if(document.hidden){ scheduleNextMeteor(); return; }
          spawnMeteor();
          scheduleNextMeteor();
        }, delay);
        starTimers.push(id);
      }
      // fire one shortly after load so it's visible right away, then keep going
      const initialId = setTimeout(spawnShootingStar, 900);
      starTimers.push(initialId);
      scheduleNext();
      const initialMeteorId = setTimeout(spawnMeteor, 6000 + Math.random()*4000);
      starTimers.push(initialMeteorId);
      scheduleNextMeteor();
      // when the tab visibility changes: cancel pending timers while
      // hidden (fully stop scheduling), and when it comes back into view,
      // wipe any stray/backed-up shooting-star elements and start fresh
      document.addEventListener('visibilitychange', ()=>{
        if(document.hidden){
          clearStarTimers();
        } else {
          starfield.querySelectorAll('.shooting-star, .meteor').forEach(el => el.remove());
          const id = setTimeout(spawnShootingStar, 900);
          starTimers.push(id);
          scheduleNext();
          scheduleNextMeteor();
        }
      });
      // low-perf mode can activate mid-flight (the fps check finishes at
      // ~5s, after these timers are already scheduled) — stop everything
      // and wipe any stray elements the moment that happens
      window.addEventListener('perfmid:on', ()=>{
        clearStarTimers();
        starfield.querySelectorAll('.shooting-star, .meteor').forEach(el => el.remove());
      });
    }
    // scroll depth — background layers drift at different rates and the
    // scene darkens slightly as you scroll down, like descending through
    // space. Kept purely to transform/opacity (rAF-throttled, passive
    // listener) so it never fights with the CSS keyframe animations — that
    // conflict (JS repositioning + a filtered fixed element repainting every
    // scroll frame) was what made the planet stutter before.
    (function(){
      const root = document.documentElement;
      let ticking = false;
      const maxDepthAt = 1800;
      function update(){
        const y = window.scrollY || window.pageYOffset || 0;
        root.style.setProperty('--scroll-y', y+'px');
        root.style.setProperty('--depth', Math.min(y/maxDepthAt, 0.55).toFixed(3));
        ticking = false;
      }
      function onScroll(){
        if(!ticking){ requestAnimationFrame(update); ticking = true; }
      }
      update();
      window.addEventListener('scroll', onScroll, {passive:true});
    })();
    // if low-perf activates late (fps check), also clear any sparkles
    // already spawned into the DOM — CSS hides them, but no reason to
    // keep them sitting around getting animated under the hood
    window.addEventListener('perfmid:on', ()=>{
      const sparkles = document.getElementById('sparkles');
      if(sparkles) sparkles.innerHTML = '';
    });
  })();
</script>

  if(document.readyState === 'complete'){ document.body.classList.add('loaded'); }

<script>
  // scroll progress bar (igual que el sitio)
  (function(){
    const bar = document.getElementById('scroll-progress-bar');
    let ticking = false;
    function update(){
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
      if(bar) bar.style.width = pct.toFixed(2)+'%';
      ticking = false;
    }
    window.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(update); ticking = true; } }, {passive:true});
    update();
  })();
</script>
<script>
  // glow que sigue el cursor (igual que el sitio)
  (function(){
    if(window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
    if(window.__MID_OR_WORSE__) return;
    const glow = document.getElementById('cursor-glow');
    if(!glow) return;
    let tx = window.innerWidth/2, ty = window.innerHeight/2, cx = tx, cy = ty;
    function loop(){
      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      glow.style.setProperty('--cx', cx+'px');
      glow.style.setProperty('--cy', cy+'px');
      requestAnimationFrame(loop);
    }
    window.addEventListener('mousemove', (e)=>{
      tx = e.clientX; ty = e.clientY;
      glow.classList.add('active');
    }, {passive:true});
    loop();
  })();
</script>
<script>
  // toggle de modo rendimiento (igual que el sitio)
  (function(){
    const perfToggle = document.getElementById('perf-toggle');
    if(!perfToggle) return;
    const syncPerfToggle = ()=>{
      const isOn = !!window.__LOW_PERF__;
      perfToggle.classList.toggle('active', isOn);
      perfToggle.title = isOn ? 'Modo rendimiento: ACTIVADO' : 'Modo rendimiento';
    };
    syncPerfToggle();
    window.addEventListener('lowperf:on', syncPerfToggle);
    window.addEventListener('perftier:change', syncPerfToggle);
    perfToggle.addEventListener('click', ()=>{
      const goingLow = !window.__LOW_PERF__;
      if(goingLow){
        window.__enableLowPerf('manual');
        try{ localStorage.setItem(window.__PERF_KEY, 'low'); }catch(e){}
      } else {
        window.__disableLowPerf();
        document.documentElement.classList.add('force-full-fx');
        try{ localStorage.setItem(window.__PERF_KEY, 'full'); }catch(e){}
      }
      syncPerfToggle();
    });
  })();
</script>
<script>
  // URL real del backend, expuesta via Cloudflare Tunnel (puerto 3002 en el CT)
  const API_URL = 'https://novedades.leianet.ar/api/novedades';

  document.getElementById('fecha').valueAsDate = new Date();

  // --- Formato de texto (negrita / cursiva / subrayado / tachado / link) ---
  function envolverSeleccion(pre, post){
    const ta = document.getElementById('texto');
    const start = ta.selectionStart, end = ta.selectionEnd;
    const valor = ta.value;
    const sel = valor.slice(start, end) || 'texto';
    ta.value = valor.slice(0, start) + pre + sel + post + valor.slice(end);
    ta.focus();
    ta.selectionStart = start + pre.length;
    ta.selectionEnd = start + pre.length + sel.length;
  }

  function insertarLink(){
    const url = prompt('URL del link (https://...)');
    if(!url) return;
    envolverSeleccion('[', '](' + url + ')');
  }

  // --- Imagen ---
  let imagenURL = null;

  document.getElementById('imagenInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const token = document.getElementById('token').value;
    const estado = document.getElementById('estado');
    if(!token){
      estado.textContent = 'Pone el token antes de subir una imagen.';
      estado.className = 'err';
      e.target.value = '';
      return;
    }
    estado.textContent = 'Subiendo imagen...';
    estado.className = '';
    try{
      const fd = new FormData();
      fd.append('imagen', file);
      const res = await fetch(API_URL + '/upload', {
        method: 'POST',
        headers: { 'x-auth-token': token },
        body: fd,
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Error al subir la imagen');
      imagenURL = data.url;
      document.getElementById('imagenPreview').src = imagenURL;
      document.getElementById('imagenPreviewWrap').style.display = 'block';
      estado.textContent = 'Imagen subida.';
      estado.className = 'ok';
    }catch(err){
      estado.textContent = 'Error: ' + err.message;
      estado.className = 'err';
      e.target.value = '';
    }
  });

  function quitarImagen(){
    imagenURL = null;
    document.getElementById('imagenInput').value = '';
    document.getElementById('imagenPreviewWrap').style.display = 'none';
  }

  async function publicar(){
    const token = document.getElementById('token').value;
    const tipo = document.getElementById('tipo').value;
    const fecha = document.getElementById('fecha').value;
    const titulo = document.getElementById('titulo').value;
    const texto = document.getElementById('texto').value;
    const estado = document.getElementById('estado');

    if(!token || !titulo || !texto){
      estado.textContent = 'Completa token, titulo y texto.';
      estado.className = 'err';
      return;
    }

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ tipo, fecha, titulo, texto, imagen: imagenURL }),
      });
      if(!res.ok){
        const err = await res.json();
        throw new Error(err.error || 'Error al publicar');
      }
      estado.textContent = 'Publicado correctamente.';
      estado.className = 'ok';
      document.getElementById('titulo').value = '';
      document.getElementById('texto').value = '';
      quitarImagen();
      cargarLista();
    }catch(e){
      estado.textContent = 'Error: ' + e.message;
      estado.className = 'err';
    }
  }

  async function borrar(id){
    const token = document.getElementById('token').value;
    if(!token){ alert('Necesitas el token para borrar.'); return; }
    if(!confirm('¿Borrar esta novedad?')) return;
    const res = await fetch(API_URL + '/' + id, { method: 'DELETE', headers: { 'x-auth-token': token } });
    if(res.ok) cargarLista(); else alert('No se pudo borrar.');
  }

  async function cargarLista(){
    const res = await fetch(API_URL);
    const lista = await res.json();
    const cont = document.getElementById('lista');
    cont.innerHTML = '';
    lista.forEach((n) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="info">
          <div class="tipo">${n.tipo.toUpperCase()}</div>
          <div class="titulo">${n.titulo}</div>
          <div class="fecha">${n.fecha}</div>
        </div>
        ${n.imagen ? `<img src="${n.imagen}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:7px;flex-shrink:0">` : ''}`;
      const btn = document.createElement('button');
      btn.className = 'del';
      btn.textContent = 'Borrar';
      btn.onclick = () => borrar(n.id);
      div.appendChild(btn);
      cont.appendChild(div);
    });
  }

  cargarLista();
</script>
</body></html>
