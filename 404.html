<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // same lightweight low-perf detection as the homepage: RAM<=3GB,
  // CPU cores<=3, or measured fps<30 in the first 5s → strip decoration
  (function(){
    var root = document.documentElement;
    window.__LOW_PERF__ = false;
    function enableLowPerf(){
      if(window.__LOW_PERF__) return;
      window.__LOW_PERF__ = true;
      root.classList.add('low-perf');
    }
    try{
      var isBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function');
      if(!isBrave){
        var mem = navigator.deviceMemory;
        var cores = navigator.hardwareConcurrency;
        if((typeof mem === 'number' && mem <= 3) || (typeof cores === 'number' && cores <= 3)){
          enableLowPerf();
        }
      }
    }catch(e){}
    (function(){
      var frames = 0, start = null, DURATION = 5000;
      function tick(ts){
        if(start === null) start = ts;
        frames++;
        if(ts - start < DURATION){ requestAnimationFrame(tick); }
        else if(frames / ((ts - start) / 1000) < 30){ enableLowPerf(); }
      }
      requestAnimationFrame(tick);
    })();
  })();
  // same theme persistence as the homepage, applied before paint
  (function(){
    var root = document.documentElement;
    try{
      if(localStorage.getItem('leianet-theme') === 'light'){
        root.setAttribute('data-theme', 'light');
      }
    }catch(e){}
  })();
</script>
<title>404 — Página no encontrada | LeiaNET</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0f11">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f11; --bg-elev:#18181b; --border:#2b2b30; --border-soft:#232326;
    --text:#ededee; --text-dim:#a9aaaf; --text-mute:#706f74; --accent:#c7c7cc;
    --mono:'JetBrains Mono', monospace; --display:'Chakra Petch', sans-serif; --body:'Inter', sans-serif;
  }
  html[data-theme="light"]{
    --bg:#f4f4f6; --bg-elev:#ffffff; --border:#dcdce1; --border-soft:#e7e7ea;
    --text:#17171a; --text-dim:#47474d; --text-mute:#83838a; --accent:#2f2f33;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:var(--body);display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;overflow:hidden;
  }
  /* a handful of static stars via box-shadow — no JS animation loop needed */
  .stars{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 82% 12%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 32% 62%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 68% 78%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 92% 52%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 55% 30%, rgba(255,255,255,.4), transparent);
  }
  html[data-theme="light"] .stars{display:none;}
  .wrap{position:relative;z-index:1;max-width:460px;text-align:center;}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:38px;}
  .brand img{height:38px;width:auto;display:block;}
  .code{
    font-family:var(--display);font-weight:700;font-size:clamp(56px,14vw,84px);
    letter-spacing:-.02em;line-height:1;margin:0 0 6px;
    color:var(--text);
  }
  .planet{
    display:inline-block;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d8d8dc, #6c6c72 70%);
    vertical-align:middle;margin:0 4px;
    animation:drift 5s ease-in-out infinite;
  }
  html.low-perf .planet{animation:none;}
  @keyframes drift{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  h1{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;letter-spacing:.01em;}
  p{font-family:var(--body);font-size:14px;line-height:1.65;color:var(--text-dim);margin:0 0 30px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;
    color:#0f0f11;background:var(--accent);padding:13px 22px;border-radius:8px;
    transition:opacity .15s ease, transform .15s ease;
  }
  html.low-perf .btn{transition:none;}
  .btn:hover{opacity:.85;}
  .btn:active{transform:scale(.96);}
  .path{
    margin-top:26px;font-family:var(--mono);font-size:11.5px;color:var(--text-mute);
    border:1px solid var(--border-soft);border-radius:20px;padding:6px 14px;display:inline-block;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="wrap">
    <a href="/" class="brand" aria-label="Ir al inicio de LeiaNET">
      <img src="assets/logo_leianetwork.png" alt="LeiaNETWORK">
    </a>
    <p class="code">4<span class="planet"></span>4</p>
    <h1>Esta página se perdió en el espacio</h1>
    <p>No encontramos lo que buscabas. Puede que el enlace esté roto o que la página se haya movido.</p>
    <a class="btn" href="/">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Volver al inicio
    </a>
    <div class="path">error 404</div>
  </div>
</body>
</html>
